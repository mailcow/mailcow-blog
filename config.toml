baseURL = "https://mailcow.email"
defaultContentLanguage = "en"
title = "mailcow: dockerized"
theme = "mailcow"

enableRobotsTXT = true
enableGitInfo = true
capitalizeListTitles = false

[pagination]
  pagerSize = 12

[services.rss]
  limit = 20

[params]
  description = "The mailserver suite with the 'moo' – 🐮 + 🐋 = 💕 | Official project page and blog"
  keywords = ["mailcow", "Docker", "Postfix", "Dovecot", "GitHub", "tinc", "E-Mail", "SOGo", "Rspamd"]
  images = ["/images/og-default.png"]
  logo = "/images/cow_mailcow.svg"
  since = 2016
  copyright = "The Infrastructure Company GmbH"
  copyrightLink = "https://tinc.gmbh?kontakt"
  repo = "https://github.com/mailcow/mailcow-blog"
  twitter = "@mailcow_email"

  [params.links]
    github = "https://github.com/mailcow/mailcow-dockerized"
    demo = "https://demo.mailcow.email"
    nightlyDemo = "https://nightly-demo.mailcow.email"
    forum = "https://community.mailcow.email"
    telegram = "https://t.me/mailcow"
    telegramOfftopic = "https://t.me/mailcowOffTopic"
    mastodon = "https://mailcow.social/@doncow"
    x = "https://x.com/mailcow_email"
    sponsors = "https://github.com/sponsors/mailcow"
    issues = "https://github.com/mailcow/mailcow-dockerized/issues"

[author]
  name = "The Infrastructure Company GmbH"
  email = "info@servercow.de"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[privacy]
  [privacy.youtube]
    disable = false
    privacyEnhanced = true

